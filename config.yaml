# Seconds each slide stays on the TRMNL. Restart the server after editing.
slide_seconds: 300
slide_order: [rss, weather, calendar, quarter, quote, newspapers, polymarket]

listen: ":8177"
base_url: "http://10.17.17.90:8177"
screen: slideshow # slideshow, cowsay, calendar, quarter, weather, or rss
timezone: America/New_York

# Empty quotes_file uses the quotes bundled into the binary.
quotes_file: ""
data_dir: ./data

# Empty frontpages_url disables newspaper slides. Covers are never cached.
frontpages_url: "http://10.17.17.90:8100"
weather_enabled: true
weather_location: "San Juan, PR"
weather_latitude: 18.4655
weather_longitude: -66.1057

# Paste up to three https://polymarket.com/event/... URLs; blank slots are skipped.
polymarket_pages:
  - "https://polymarket.com/event/what-price-will-bitcoin-hit-before-2027"
  - "https://polymarket.com/event/which-party-will-win-the-house-in-2026"
  - "https://polymarket.com/event/which-party-will-win-the-senate-in-2026"

# Empty rss_url disables Top News. Empty/offline feeds are retried every minute.
rss_url: "http://10.17.17.98:8090/up2date/rss.xml"
